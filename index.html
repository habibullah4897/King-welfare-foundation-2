
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script type="module">
  // =====================================
  // KING WELFARE FOUNDATION
  // FIREBASE + ANALYTICS + VISITOR TRACKING
  // =====================================

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

  import {
    getAnalytics,
    logEvent,
    isSupported
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-analytics.js";

  import {
    getFirestore,
    collection,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

  // FIREBASE CONFIGURATION
  const firebaseConfig = {
    apiKey: "AIzaSyATbTZW9xVdos4JxMIWpgcfMnVowCb3U34",
    authDomain: "kingwellfairfoundation2-e68bd.firebaseapp.com",
    projectId: "kingwellfairfoundation2-e68bd",
    storageBucket: "kingwellfairfoundation2-e68bd.firebasestorage.app",
    messagingSenderId: "492190272172",
    appId: "1:492190272172:web:7cbe0090b0efec05b92d09",
    measurementId: "G-SJP0K2HDGW"
  };

  // INITIALIZE FIREBASE
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // =====================================
  // GOOGLE ANALYTICS
  // =====================================

  let analytics = null;

  async function startAnalytics() {
    try {
      if (await isSupported()) {
        analytics = getAnalytics(app);

        // Website visitor
        logEvent(analytics, "website_visit", {
          page_path: location.pathname,
          page_title: document.title
        });

        // Standard page view
        logEvent(analytics, "page_view", {
          page_location: location.href,
          page_title: document.title,
          page_path: location.pathname
        });

        console.log("King Welfare Analytics Connected");
      }
    } catch (error) {
      console.error("Analytics error:", error);
    }
  }

  startAnalytics();

  function trackEvent(eventName, details = {}) {
    if (!analytics) return;

    try {
      logEvent(analytics, eventName, details);
    } catch (error) {
      console.error("Tracking error:", error);
    }
  }

  // =====================================
  // MOBILE NAVIGATION
  // =====================================

  const menuBtn = document.getElementById("menuBtn");
  const navlinks = document.getElementById("navlinks");

  if (menuBtn && navlinks) {
    menuBtn.addEventListener("click", function() {
      navlinks.classList.toggle("open");
    });

    document.querySelectorAll(".navlinks a").forEach(link => {
      link.addEventListener("click", function() {
        navlinks.classList.remove("open");
      });
    });
  }

  // =====================================
  // COPY BUTTONS
  // =====================================

  document.querySelectorAll("[data-copy]").forEach(button => {
    button.addEventListener("click", async function() {
      const element = document.getElementById(
        this.getAttribute("data-copy")
      );

      if (!element) return;

      const value = element.innerText.trim();

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(value);
        } else {
          const temp = document.createElement("textarea");
          temp.value = value;
          temp.style.position = "fixed";
          temp.style.opacity = "0";
          document.body.appendChild(temp);
          temp.select();

          if (!document.execCommand("copy")) {
            throw new Error("Copy failed");
          }

          temp.remove();
        }

        const oldText = this.innerText;
        this.innerText = "Copied!";

        setTimeout(() => {
          this.innerText = oldText;
        }, 1800);

        trackEvent("donation_details_copy", {
          copied_field: element.id
        });

      } catch (error) {
        alert("Copy failed. Please select and copy manually.");
        console.error(error);
      }
    });
  });

  // =====================================
  // USDT TRC20 QR CODE
  // =====================================

  const walletAddress =
    "TPrJz3PpWf9qMJz9QhxpWsPcyhQNfkfrFF";

  const qrContainer = document.getElementById("qrcode");

  if (qrContainer) {
    if (typeof QRCode !== "undefined") {
      qrContainer.innerHTML = "";

      new QRCode(qrContainer, {
        text: walletAddress,
        width: 180,
        height: 180,
        colorDark: "#075b46",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    } else {
      qrContainer.innerText = "QR code could not load.";
    }
  }

  // =====================================
  // DONATION TRACKING
  // =====================================

  const donationSection = document.getElementById("donate");

  if (donationSection && "IntersectionObserver" in window) {
    const donationObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          trackEvent("donation_page_view", {
            page_path: location.pathname
          });

          donationObserver.disconnect();
        }
      });
    }, {
      threshold: 0.35
    });

    donationObserver.observe(donationSection);
  }

  // DONATE BUTTON CLICKS
  document.addEventListener("click", function(event) {
    const button = event.target.closest("a, button");

    if (!button) return;

    const text = (
      button.innerText ||
      button.getAttribute("aria-label") ||
      ""
    ).toLowerCase();

    const href = (
      button.getAttribute("href") || ""
    ).toLowerCase();

    if (/donate|donation|contribute/.test(text + " " + href)) {
      trackEvent("donate_click", {
        button_text: text.substring(0, 100),
        page_path: location.pathname
      });
    }
  });

  // =====================================
  // FIRESTORE FOUNDATION UPDATES
  // =====================================

  const postsContainer = document.getElementById("posts");
  const postsStatus = document.getElementById("postsStatus");

  function showMessage(message) {
    if (postsStatus) {
      postsStatus.textContent = message;
    }
  }

  function renderPosts(snapshot) {
    if (!postsContainer) return;

    postsContainer.innerHTML = "";

    const publishedPosts = snapshot.docs
      .map(doc => ({
        id: doc.id,
        ...doc.data()
      }))
      .filter(post =>
        String(post.status || "").toLowerCase() === "published"
      )
      .sort((a, b) => {
        const dateA = a.createdAt?.toMillis?.() || 0;
        const dateB = b.createdAt?.toMillis?.() || 0;
        return dateB - dateA;
      });

    if (publishedPosts.length === 0) {
      postsContainer.innerHTML =
        '<div class="status">No published updates available yet.</div>';

      showMessage("");
      return;
    }

    publishedPosts.forEach(post => {
      const article = document.createElement("article");
      article.className = "post";

      const heading = document.createElement("h3");
      heading.textContent =
        post.title || post.Title || "Foundation Update";

      const paragraph = document.createElement("p");
      paragraph.textContent =
        post.content || post.Content || "";

      const date = document.createElement("small");

      let dateText = "";

      if (post.createdAt?.toDate) {
        dateText = post.createdAt.toDate().toLocaleDateString();
      } else if (post.date) {
        dateText = String(post.date);
      }

      date.textContent = dateText;

      article.appendChild(heading);
      article.appendChild(paragraph);

      if (dateText) {
        article.appendChild(date);
      }

      postsContainer.appendChild(article);
    });

    showMessage("Latest foundation updates loaded successfully.");
  }

  // REALTIME FIRESTORE LISTENER
  try {
    onSnapshot(
      collection(db, "posts"),
      snapshot => {
        renderPosts(snapshot);
        console.log("Foundation updates loaded.");
      },
      error => {
        console.error("Firestore error:", error);

        if (postsContainer) {
          postsContainer.innerHTML =
            '<div class="status">Unable to load updates. Please try again later.</div>';
        }

        showMessage("Please check Firebase Firestore permissions.");
      }
    );

  } catch (error) {
    console.error("Firestore setup error:", error);
    showMessage("Firebase connection error.");
  }

  // =====================================
  // FOOTER YEAR
  // =====================================

  const yearElement = document.getElementById("year");

  if (yearElement) {
    yearElement.textContent = new Date().getFullYear();
  }

  console.log("King Welfare Foundation Website Ready");

</script>

</body>
</html>
