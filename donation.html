
<!-- FIREBASE CONNECTION -->

<script type="module">

import { initializeApp, getApps, getApp }
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import { getFirestore, doc, onSnapshot }
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const status = document.getElementById("firebaseStatus");

if (!status) {
  alert("ERROR: firebaseStatus element not found in HTML");
  throw new Error("firebaseStatus element missing");
}

const firebaseConfig = {
  apiKey: "AIzaSyATbTZW9xVdos4JxMIWpgcfMnVowCb3U34",
  authDomain: "kingwellfairfoundation2-e68bd.firebaseapp.com",
  projectId: "kingwellfairfoundation2-e68bd",
  storageBucket: "kingwellfairfoundation2-e68bd.firebasestorage.app",
  messagingSenderId: "492190272172",
  appId: "1:492190272172:web:7cbe0090b0efec05b92d09",
  measurementId: "G-SJP0K2HDGW"
};

const targets = {
  orphans: 850,
  poor: 1000,
  disabled: 750
};

const elements = {
  orphans: {
    bar: "orphanBar",
    percent: "orphanPercent",
    collected: "orphanCollected"
  },
  poor: {
    bar: "poorBar",
    percent: "poorPercent",
    collected: "poorCollected"
  },
  disabled: {
    bar: "disabledBar",
    percent: "disabledPercent",
    collected: "disabledCollected"
  }
};

function showError(message) {
  status.textContent = message;
  console.error(message);
}

try {

  status.textContent = "Connecting to Firebase...";

  const app = getApps().length > 0
    ? getApp()
    : initializeApp(firebaseConfig);

  const db = getFirestore(app);

  const progressRef = doc(
    db,
    "settings",
    "donationProgress"
  );

  onSnapshot(
    progressRef,

    (snapshot) => {

      if (!snapshot.exists()) {
        showError(
          "ERROR: settings/donationProgress document not found."
        );
        return;
      }

      const data = snapshot.data();

      Object.keys(targets).forEach((category) => {

        const collected = Math.max(
          0,
          Number(data[category] || 0)
        );

        const percentage = Math.min(
          100,
          Math.round(
            collected / targets[category] * 100
          )
        );

        const ids = elements[category];

        const bar = document.getElementById(ids.bar);
        const percent = document.getElementById(ids.percent);
        const amount = document.getElementById(ids.collected);

        if (!bar || !percent || !amount) {
          throw new Error(
            "Missing HTML elements for " + category
          );
        }

        bar.style.width = percentage + "%";
        percent.textContent = percentage + "%";

        amount.textContent =
          "Collected: $" +
          collected.toLocaleString("en-US");
      });

      status.textContent =
        "Donation progress connected successfully.";
    },

    (error) => {

      showError(
        "FIRESTORE ERROR: " +
        (error.code || "unknown") +
        " - " +
        (error.message || String(error))
      );

    }
  );

} catch (error) {

  showError(
    "FIREBASE SETUP ERROR: " +
    (error.code || "unknown") +
    " - " +
    (error.message || String(error))
  );

}

    </script>
