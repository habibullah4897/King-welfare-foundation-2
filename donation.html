
<!-- FIREBASE CONNECTION -->

<script type="module">

import { initializeApp, getApps, getApp }
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import { getFirestore, doc, onSnapshot }
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const status = document.getElementById("firebaseStatus");

const firebaseConfig = {
  apiKey: "AIzaSyATbTZW9xVdos4JxMIWpgcfMnVowCb3U34",
  authDomain: "kingwellfairfoundation2-e68bd.firebaseapp.com",
  projectId: "kingwellfairfoundation2-e68bd",
  storageBucket: "kingwellfairfoundation2-e68bd.firebasestorage.app",
  messagingSenderId: "492190272172",
  appId: "1:492190272172:web:7cbe0090b0efec05b92d09",
  measurementId: "G-SJP0K2HDGW"
};

const targets = {
  orphans: 850,
  poor: 1000,
  disabled: 750
};

const elements = {
  orphans: {
    bar: "orphanBar",
    percent: "orphanPercent",
    collected: "orphanCollected"
  },
  poor: {
    bar: "poorBar",
    percent: "poorPercent",
    collected: "poorCollected"
  },
  disabled: {
    bar: "disabledBar",
    percent: "disabledPercent",
    collected: "disabledCollected"
  }
};

try {

  const app = getApps().length
    ? getApp()
    : initializeApp(firebaseConfig);

  const db = getFirestore(app);

  status.textContent = "Connecting to Firebase...";

  onSnapshot(
    doc(db, "settings", "donationProgress"),

    (snapshot) => {

      if (!snapshot.exists()) {
        status.textContent =
          "ERROR: Document settings/donationProgress not found.";
        return;
      }

      const data = snapshot.data();

      Object.keys(targets).forEach((category) => {

        const collected = Math.max(
          0,
          Number(data[category] || 0)
        );

        const percentage = Math.min(
          100,
          Math.round(collected / targets[category] * 100)
        );

        const ids = elements[category];

        document.getElementById(ids.bar).style.width =
          percentage + "%";

        document.getElementById(ids.percent).textContent =
          percentage + "%";

        document.getElementById(ids.collected).textContent =
          "Collected: $" + collected.toLocaleString("en-US");
      });

      status.textContent =
        "Donation progress connected successfully.";
    },

    (error) => {
      console.error("Firestore error:", error);

      status.textContent =
        "FIRESTORE ERROR: " +
        (error.code || "") + " " +
        (error.message || String(error));
    }
  );

} catch (error) {

  console.error("Firebase initialization error:", error);

  status.textContent =
    "FIREBASE SETUP ERROR: " +
    (error.code || "") + " " +
    (error.message || String(error));
}

</script>
